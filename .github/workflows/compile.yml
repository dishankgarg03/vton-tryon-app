name: Online Android APK Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the compilation manually with a button click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Environment (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradle Compiler
      run: chmod +x gradlew

    - name: Compile Photorealistic Try-On App (Build APK)
      run: ./gradlew assembleDebug

    - name: Upload Finished APK Installer to Cloud
      uses: actions/upload-artifact@v4
      with:
        name: vton-app-installer
        path: app/build/outputs/apk/debug/app-debug.apk
